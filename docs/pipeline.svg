<rect x="960" y="60" width="150" height="70" rx="6" fill="#e8f0fe" stroke="#333"/>
<text x="1035.0" y="86" text-anchor="middle" font-weight="bold">stage N-1</text>
<text x="1035.0" y="104" text-anchor="middle" font-size="11">>>>(N-1)</text>
<text x="1035.0" y="120" text-anchor="middle" font-size="11" fill="#666">1 reg</text>
