<text x="70" y="160" font-size="12">W bits in  |  internal x/y: W+1+G bits (1 growth + G guard), z: W+G bits  |  W bits out (x/y saturate, z wraps)</text>
<text x="70" y="180" font-size="12" fill="#666">blue: cordic_pipeline generate loop (cordic_stage x N_ITER)   valid is the only reset state; mode rides with the data</text>
